<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <!-- Default (dark) status-bar tint; the boot script + theme.js update this to
       match the active theme. Kept equal to the dark --theme-color token. -->
  <meta name="theme-color" content="#10131a" />
  <title>K-LINE MEN Catalog</title>
  <!-- Home-screen install support. The VitePWA plugin injects the manifest link;
       iOS needs these explicit tags to install cleanly (standalone display, the
       right icon, and a dark status bar that respects our safe-area insets). -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="K-LINE MEN" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Apply the saved light/dark preference before the first paint so there's no
       dark-then-light flash on a light-mode device. Mirrors theme.js, which
       takes over once the module loads. Inlined (not imported) precisely so it
       runs ahead of the stylesheet. -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem("klm-theme");
        var light = p === "light" ||
          (p !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches);
        if (light) document.documentElement.setAttribute("data-theme", "light");
        document.documentElement.style.colorScheme = light ? "light" : "dark";
        // Match the status bar straight away (theme.js keeps these in sync after).
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", light ? "#ffffff" : "#10131a");
      } catch (e) { /* storage blocked — fall back to the CSS default (dark) */ }
    })();
  </script>
  <!-- styles.css is imported by main.js so Vite bundles & fingerprints it. -->
</head>
<body>
  <!-- Single mount point; main.js renders from the Railway API session. -->
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
