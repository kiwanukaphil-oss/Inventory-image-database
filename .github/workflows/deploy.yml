name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages on every push to main.
# The browser bundle receives only the public Railway catalog API origin.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Quality gate: the unit suite must pass before anything is built or deployed
  # (audit P2). A failing test blocks the GitHub Pages deploy.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify database migrations and RLS invariants
        run: npm run test:db
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_CATALOG_API_URL: ${{ secrets.VITE_CATALOG_API_URL }}
        run: npm run build
      - name: Verify Railway-only browser bundle
        run: npm run verify:railway-only

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
